<!DOCTYPE html>
<html>
    <head><title>form css</title>
    <style>
.header{
    width: 300px;
    padding: 20px;
    margin: auto;
  
}

input {
    padding: 2px;
    margin: 5px;
}
button{
    display: flex;
    justify-content: center;
    margin: auto;
    text-transform: uppercase;
 align-items: center;
}
    </style></head>
    <body>
        <div class="header";>
<form>
    <label>Name:</label>
    <input type="text">

    <br><br>

    <label>Email:</label>
    <input type="email">

    <br><br>

    <label>Password:</label>
    <input type="password">

    <br><br>

    <button>Submit</button>
</form>
</div>
    </body>
</html>
